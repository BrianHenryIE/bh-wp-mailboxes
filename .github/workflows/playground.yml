name: WordPress Playground

# Builds the development plugin as a self-contained plugin and boots it in WordPress Playground.
#
# The development plugin normally loads the library from the project root (wp-env maps the
# project into the site). Here, the plugin is copied to a directory outside the project, the
# project composer.json is copied in, and a Composer `path` repository pointing back at the
# project is added, so `composer install` places the library and its dependencies inside the
# plugin's own vendor directory (see the matching autoloader branch in development-plugin.php).
#
# The blueprint activates the plugin — a fatal on activation fails the boot — and the smoke
# test asserts the plugin's REST namespace is registered.
#
# @author BrianHenryIE

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  playground:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: ${{ runner.temp }}/bh-wp-mailboxes-development-plugin

    steps:

      - name: Git checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Copy the development plugin outside the project
        run: |
          mkdir -p "$BUILD_DIR"
          cp -R development-plugin/. "$BUILD_DIR/"
          cp composer.json "$BUILD_DIR/"

      # Point a Composer `path` repository at the project so the library installs into the
      # plugin's own vendor directory. The copied composer.json is the library's own, so the
      # root package is renamed, and require/require-dev are replaced with only what the
      # development plugin needs at runtime (`bh-wp-logger` also satisfies the library's
      # `psr/log-implementation` requirement via monolog). The project's autoload,
      # autoload-dev and post-autoload-dump scripts reference paths that do not exist in
      # the build directory, so they are removed.
      - name: Add the project as a Composer path repository
        run: |
          jq --arg url "$GITHUB_WORKSPACE" '
            .name = "brianhenryie/bh-wp-mailboxes-development-plugin"
            | .repositories = {
                "brianhenryie/bh-wp-mailboxes": {
                  "type": "path",
                  "url": $url,
                  "options": {
                    "symlink": false,
                    "versions": { "brianhenryie/bh-wp-mailboxes": "dev-master" }
                  }
                }
              }
            | .require = {
                "php": .require.php,
                "brianhenryie/bh-wp-mailboxes": "dev-master",
                "alleyinteractive/wordpress-autoloader": .["require-dev"]["alleyinteractive/wordpress-autoloader"],
                "brianhenryie/bh-wp-logger": .["require-dev"]["brianhenryie/bh-wp-logger"],
                "google/apiclient": .["require-dev"]["google/apiclient"],
                "vlucas/phpdotenv": .["require-dev"]["vlucas/phpdotenv"]
              }
            | .scripts = { "pre-autoload-dump": [ "Google\\Task\\Composer::cleanup" ] }
            | del(.["require-dev"], .autoload, .["autoload-dev"], .suggest)
          ' "$BUILD_DIR/composer.json" > "$BUILD_DIR/composer.tmp.json"
          mv "$BUILD_DIR/composer.tmp.json" "$BUILD_DIR/composer.json"

      - name: Install PHP dependencies
        run: composer install --working-dir="$BUILD_DIR" --no-dev --no-interaction

      - name: Start WordPress Playground
        run: |
          nohup npx @wp-playground/cli@latest server \
            --php=8.4 \
            --wp=latest \
            --port=9400 \
            --mount="$BUILD_DIR:/wordpress/wp-content/plugins/development-plugin" \
            --blueprint=.github/playground-blueprint.json \
            > "$RUNNER_TEMP/playground.log" 2>&1 &

          # The port answers 502 "WordPress is not ready yet" while Playground boots,
          # so wait for HTTP 200 specifically.
          echo "Waiting for WordPress Playground to be ready..."
          for i in {1..90}; do
            if [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9400/)" = "200" ]; then
              echo "WordPress Playground is ready!"
              exit 0
            fi
            echo "Attempt $i: WordPress Playground not ready yet..."
            sleep 2
          done
          echo "WordPress Playground did not start."
          cat "$RUNNER_TEMP/playground.log"
          exit 1

      - name: Smoke test – development plugin REST namespace is registered
        run: |
          curl -sf 'http://127.0.0.1:9400/?rest_route=/' > "$RUNNER_TEMP/rest-index.json"
          jq -e '.namespaces | index("bh-wp-mailboxes-dev/v2")' "$RUNNER_TEMP/rest-index.json" \
            || { echo "Development plugin REST namespace not found."; jq '.namespaces' "$RUNNER_TEMP/rest-index.json"; exit 1; }

      - name: Print Playground log
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/playground.log"
